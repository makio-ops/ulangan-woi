<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CBT Bahasa Indonesia</title>
<style>
body{
font-family:Arial,sans-serif;
max-width:800px;
margin:auto;
padding:20px;
}
.soal{
border:1px solid #ccc;
padding:10px;
margin:10px 0;
}
button{
padding:10px 20px;
font-size:16px;
}
</style>
</head>
<body>

<h1>CBT Bahasa Indonesia</h1>

<div id="timer">30:00</div>

<form id="quiz">

<div class="soal">
<p>1. Pengertian negosiasi adalah ...</p>
<input type="radio" name="q1" value="A"> Proses tawar-menawar<br>
<input type="radio" name="q1" value="B"> Puisi<br>
<input type="radio" name="q1" value="C"> Cerpen<br>
<input type="radio" name="q1" value="D"> Biografi
</div>

<div class="soal">
<p>2. Struktur pertama teks biografi adalah ...</p>
<input type="radio" name="q2" value="A"> Orientasi<br>
<input type="radio" name="q2" value="B"> Penutup<br>
<input type="radio" name="q2" value="C"> Tema<br>
<input type="radio" name="q2" value="D"> Amanat
</div>

<div class="soal">
<p>3. Majas "angin bernyanyi" disebut ...</p>
<input type="radio" name="q3" value="A"> Personifikasi<br>
<input type="radio" name="q3" value="B"> Metafora<br>
<input type="radio" name="q3" value="C"> Litotes<br>
<input type="radio" name="q3" value="D"> Ironi
</div>

<button type="button" onclick="cekNilai()">Selesai</button>

</form>

<h2 id="hasil"></h2>

<script>

let waktu = 1800;

setInterval(function(){
waktu--;

let menit = Math.floor(waktu/60);
let detik = waktu%60;

document.getElementById("timer").innerHTML =
String(menit).padStart(2,"0")+":"+
String(detik).padStart(2,"0");

},1000);

function cekNilai(){

let nilai = 0;

if(document.querySelector('input[name="q1"]:checked')?.value=="A") nilai++;
if(document.querySelector('input[name="q2"]:checked')?.value=="A") nilai++;
if(document.querySelector('input[name="q3"]:checked')?.value=="A") nilai++;

document.getElementById("hasil").innerHTML =
"Nilai Kamu: " + (nilai*100/3).toFixed(0);

}

</script>

</body>
</html>
