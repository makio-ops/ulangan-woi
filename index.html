<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CBT Bahasa Indonesia</title>

<style>
body{
font-family:Arial,sans-serif;
max-width:900px;
margin:auto;
padding:20px;
background:#f4f4f4;
}

h1{
text-align:center;
}

#timer{
position:sticky;
top:0;
background:white;
padding:10px;
font-size:24px;
font-weight:bold;
text-align:center;
border:1px solid #ccc;
margin-bottom:20px;
}

.question{
background:white;
padding:15px;
margin-bottom:15px;
border-radius:8px;
}

button{
width:100%;
padding:15px;
font-size:18px;
cursor:pointer;
}

#result{
margin-top:20px;
font-size:24px;
font-weight:bold;
text-align:center;
}
</style>

</head>
<body>

<h1>CBT Bahasa Indonesia</h1>

<div id="timer">30:00</div>

<form id="quiz"></form>

<button onclick="finishQuiz()" type="button">Selesai</button>

<div id="result"></div>

<script>

const questions = [
{
q:"Pengertian negosiasi adalah ...",
a:["Proses tawar-menawar","Cerita hidup","Puisi","Laporan"],
c:"A"
},
{
q:"Struktur pertama teks negosiasi adalah ...",
a:["Penutup","Orientasi","Persetujuan","Pengajuan"],
c:"B"
},
{
q:"Bahasa dalam negosiasi harus ...",
a:["Santun","Kasar","Sembarangan","Emosional"],
c:"A"
},
{
q:"Struktur pertama biografi adalah ...",
a:["Orientasi","Reorientasi","Koda","Penutup"],
c:"A"
},
{
q:"Ide pokok adalah ...",
a:["Gagasan utama","Contoh","Judul","Kalimat penjelas"],
c:"A"
}
];

while(questions.length < 30){
questions.push({
q:"Soal latihan tambahan nomor " + (questions.length + 1),
a:["Pilihan A","Pilihan B","Pilihan C","Pilihan D"],
c:"A"
});
}

const quiz = document.getElementById("quiz");

questions.forEach((item,index)=>{

let html = `
<div class="question">
<p><b>${index+1}. ${item.q}</b></p>
`;

["A","B","C","D"].forEach((letter,i)=>{
html += `
<label>
<input type="radio" name="q${index}" value="${letter}">
${letter}. ${item.a[i]}
</label><br>
`;
});

html += `</div>`;

quiz.innerHTML += html;

});

let time = 1800;

const timer = setInterval(()=>{

time--;

let minutes = Math.floor(time/60);
let seconds = time%60;

document.getElementById("timer").innerHTML =
String(minutes).padStart(2,"0")+":"+
String(seconds).padStart(2,"0");

if(time<=0){
clearInterval(timer);
finishQuiz();
}

},1000);

function finishQuiz(){

let score = 0;

questions.forEach((q,index)=>{

const selected =
document.querySelector(`input[name="q${index}"]:checked`);

if(selected && selected.value===q.c){
score++;
}

});

const nilai =
Math.round((score/questions.length)*100);

document.getElementById("result").innerHTML =
`Benar ${score}/${questions.length}<br>Nilai: ${nilai}`;

window.scrollTo(0,document.body.scrollHeight);

}

</script>

</body>
</html>
